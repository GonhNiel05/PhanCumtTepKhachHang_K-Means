<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân cụm khách hàng bằng thuật toán K-Means</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .notice {
      max-width: 720px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    p {
      margin: 8px 0;
      line-height: 1.6;
    }
    code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="notice">
    <h1>Frontend React chưa được build</h1>
    <p>Trang web hiện đã được chuyển sang React. Hãy build frontend để hiển thị giao diện mới.</p>
    <p><strong>Hướng dẫn nhanh:</strong></p>
    <p>
      <code>cd Machine_Learning/web/frontend</code><br />
      <code>npm install</code><br />
      <code>npm run build</code>
    </p>
    <p>Sau đó chạy lại Flask và mở <code>http://localhost:5000</code>.</p>
  </div>
</body>
</html>
